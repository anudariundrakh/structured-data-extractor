[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Fault-tolerant invoice extraction with Pydantic v2 validation, reflection retries, and DLQ fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "openai>=1.60",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "streamlit>=1.39",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
